<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<style>
  :root{
    --bg1:#1b1464; --bg2:#7b2ff7; --bg3:#f107a3; --bg4:#ff9a3c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,sans-serif;color:#fff}
  body{
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
    background-size:400% 400%;
    animation:bgmove 14s ease infinite;
  }
  @keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  /* spotlight rays */
  .rays{position:fixed;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 8deg,transparent 8deg 20deg);
    animation:spin 50s linear infinite;z-index:0;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* rising balloons */
  .balloon{position:fixed;bottom:-140px;width:56px;height:70px;border-radius:50% 50% 48% 48%;
    z-index:1;opacity:.95;animation:rise linear infinite;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12), inset 8px 10px 0 rgba(255,255,255,.25)}
  .balloon::after{content:"";position:absolute;left:50%;bottom:-34px;width:2px;height:36px;background:rgba(255,255,255,.7)}
  .balloon::before{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-bottom-color:inherit;border-top:0}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(-4deg)}
    25%{transform:translateY(-30vh) translateX(18px) rotate(4deg)}
    50%{transform:translateY(-62vh) translateX(-18px) rotate(-4deg)}
    75%{transform:translateY(-95vh) translateX(18px) rotate(4deg)}
    100%{transform:translateY(-130vh) translateX(0) rotate(-4deg)}
  }

  /* floating emojis */
  .float{position:fixed;font-size:28px;z-index:1;animation:drift ease-in-out infinite;user-select:none;pointer-events:none}
  @keyframes drift{
    0%,100%{transform:translate(0,0) rotate(-10deg) scale(1)}
    50%{transform:translate(14px,-26px) rotate(12deg) scale(1.2)}
  }

  /* main stage */
  .stage{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:12px;text-align:center}

  h1.hb{font-size:clamp(34px,8vw,84px);line-height:1.05;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.45)}
  h1.hb span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
  h1.hb .sp{width:.35em}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

  .photo-wrap{position:relative;width:min(46vw,300px);height:min(46vw,300px);animation:wobble 4s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
  .ring{position:absolute;inset:-14px;border-radius:50%;border:5px dashed #fff59d;animation:spin 12s linear infinite}
  .ring2{position:absolute;inset:-28px;border-radius:50%;border:4px dotted #80f7ff;animation:spin 18s linear infinite reverse}
  .photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 60px rgba(255,255,255,.4);background:#ffffff22}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .hat{position:absolute;top:-52px;left:50%;font-size:64px;transform:translateX(-50%) rotate(14deg);filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));animation:hatwig 2s ease-in-out infinite}
  @keyframes hatwig{0%,100%{transform:translateX(-50%) rotate(10deg)}50%{transform:translateX(-50%) rotate(20deg)}}
  .orbit{position:absolute;inset:-60px;animation:spin 9s linear infinite}
  .orbit b{position:absolute;font-size:30px;font-weight:400}
  .orbit b:nth-child(1){top:0;left:50%}
  .orbit b:nth-child(2){top:50%;right:0}
  .orbit b:nth-child(3){bottom:0;left:50%}
  .orbit b:nth-child(4){top:50%;left:0}

  .main{font-size:clamp(22px,5.6vw,46px);font-weight:900;padding:12px 26px;border-radius:22px;
    background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.55);
    text-shadow:0 3px 0 rgba(0,0,0,.25);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .hint{font-size:14px;opacity:.9}

  /* cake */
  .cake{font-size:clamp(34px,6vw,56px);animation:cake 1.2s ease-in-out infinite}
  @keyframes cake{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.15) rotate(6deg)}}

  /* music controls */
  #mute{position:fixed;top:14px;right:14px;z-index:10;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #tap{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,5,40,.78);cursor:pointer;text-align:center;padding:20px}
  #tap div{font-size:clamp(22px,5vw,40px);font-weight:900;animation:pulse 1.4s infinite}
  #tap small{display:block;font-size:15px;font-weight:400;margin-top:10px;opacity:.85}
</style>
</head>
<body>

<div class="rays"></div>
<canvas id="confetti"></canvas>

<!-- tap-to-start overlay (only shown if the browser blocks autoplay) -->
<div id="tap"><div>🎉 Tap anywhere to start the party 🎉<small>(music will play)</small></div></div>
<button id="mute" title="Music on/off">🔊</button>

<div class="stage">
  <h1 class="hb" id="title"></h1>

  <div class="photo-wrap">
    <div class="ring2"></div>
    <div class="ring"></div>
    <div class="orbit"><b>🎈</b><b>🎁</b><b>🎊</b><b>⭐</b></div>
    <div class="photo"><img src="pht81.jpeg" alt="Birthday girl"></div>
    <div class="hat">🥳</div>
  </div>

  <div class="main">Hamesha aise hi hasti raho😂</div>
  <div class="cake">🎂🎉🍰</div>
  <div class="hint">Tap anywhere for more confetti!</div>
</div>

<audio id="bgm" src="birthday.mp3" loop preload="auto"></audio>

<script>
/* ---------- Title letters ---------- */
(function(){
  const text = "Happy Birthday!";
  const colors = ["#fff59d","#80f7ff","#ffd1f0","#b9ff9e","#ffc27a","#ffffff"];
  const t = document.getElementById("title");
  let i = 0;
  text.split("").forEach(ch=>{
    const s = document.createElement("span");
    if(ch===" "){ s.className="sp"; s.innerHTML="&nbsp;"; }
    else { s.textContent = ch; s.style.color = colors[i % colors.length]; s.style.animationDelay = (i*0.09)+"s"; i++; }
    t.appendChild(s);
  });
})();

/* ---------- Balloons ---------- */
(function(){
  const cols = ["#ff5e7e","#ffd23f","#3ddc97","#4cc9f0","#ff9f1c","#b388ff","#ff6ec7"];
  for(let i=0;i<16;i++){
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = (Math.random()*96)+"vw";
    const c = cols[i % cols.length];
    b.style.background = c; b.style.color = c;
    b.style.animationDuration = (10 + Math.random()*10)+"s";
    b.style.animationDelay = (-Math.random()*18)+"s";
    const sc = .7 + Math.random()*.8;
    b.style.width = (56*sc)+"px"; b.style.height = (70*sc)+"px";
    document.body.appendChild(b);
  }
})();

/* ---------- Floating emojis (no hearts) ---------- */
(function(){
  const em = ["🎉","🎊","🎂","🥳","🎁","✨","⭐","🍰","🎈","😂","🎶","🌟","🧁","🍭"];
  for(let i=0;i<20;i++){
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = em[i % em.length];
    f.style.left = (Math.random()*94)+"vw";
    f.style.top = (Math.random()*90)+"vh";
    f.style.fontSize = (20 + Math.random()*26)+"px";
    f.style.animationDuration = (3 + Math.random()*4)+"s";
    f.style.animationDelay = (-Math.random()*5)+"s";
    document.body.appendChild(f);
  }
})();

/* ---------- Confetti ---------- */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener("resize", resize);
const palette = ["#ff5e7e","#ffd23f","#3ddc97","#4cc9f0","#ff9f1c","#b388ff","#ffffff"];
let bits = [];
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,w:6+Math.random()*8,h:4+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:palette[(Math.random()*palette.length)|0],life:140+Math.random()*80});
  }
}
function rain(){
  for(let i=0;i<4;i++){
    bits.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,w:6+Math.random()*7,h:4+Math.random()*6,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:palette[(Math.random()*palette.length)|0],life:400});
  }
}
function frame(){
  cx.clearRect(0,0,cv.width,cv.height);
  rain();
  bits = bits.filter(b=>b.life>0 && b.y<cv.height+20);
  for(const b of bits){
    b.x+=b.vx; b.y+=b.vy; b.vy+=.12; b.vx*=.99; b.r+=b.vr; b.life--;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  }
  requestAnimationFrame(frame);
}
frame();

/* opening fireworks */
setTimeout(()=>burst(innerWidth*.2,innerHeight*.35,90),300);
setTimeout(()=>burst(innerWidth*.8,innerHeight*.35,90),700);
setTimeout(()=>burst(innerWidth*.5,innerHeight*.25,120),1100);
setInterval(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.5,50),3500);

/* tap = confetti burst */
addEventListener("pointerdown",e=>burst(e.clientX,e.clientY,70));

/* ---------- Music ---------- */
const bgm = document.getElementById("bgm"), tap = document.getElementById("tap"), mute = document.getElementById("mute");
bgm.volume = 0.9;
function startMusic(){
  const p = bgm.play();
  if(p && p.catch){ p.then(()=>{tap.style.display="none"}).catch(()=>{tap.style.display="flex"}); }
}
tap.addEventListener("click",()=>{ bgm.play(); tap.style.display="none"; });
mute.addEventListener("click",e=>{
  e.stopPropagation();
  if(bgm.paused){ bgm.play(); bgm.muted=false; mute.textContent="🔊"; }
  else { bgm.pause(); mute.textContent="🔇"; }
});
window.addEventListener("load",startMusic);
</script>
</body>
</html>
