<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Page 7 · Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4fb;--pink:#ff6fb5;--gold:#ffd166;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#4a1470 0,#1d0a3a 55%,#0c0520 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px;overflow:hidden;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),radial-gradient(2px 2px at 40% 70%,#ffd6ef,transparent),radial-gradient(1.5px 1.5px at 90% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 25% 88%,#fff,transparent),radial-gradient(2px 2px at 62% 40%,#fff8c9,transparent);
  animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.fl{position:fixed;font-size:26px;opacity:.7;pointer-events:none;animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(10deg)}}
h1{margin:0;font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(22px,5vw,34px);text-align:center;text-shadow:0 0 18px rgba(255,111,181,.7)}
.sub{margin:-4px 0 0;font-size:13px;opacity:.8;text-align:center}
.hud{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:16px;backdrop-filter:blur(6px);transition:transform .15s}
.chip.bump{transform:scale(1.25);color:var(--gold)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer}
.ib:focus-visible,.dp button:focus-visible,#go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:relative;border-radius:18px;border:3px solid var(--pink);box-shadow:0 0 30px rgba(255,111,181,.5),inset 0 0 40px rgba(0,0,0,.4);background:#170a30;touch-action:none}
canvas{display:block;border-radius:15px;touch-action:none}
#bubble{position:absolute;z-index:3;pointer-events:none;width:max-content;max-width:190px;padding:7px 12px;border-radius:16px;background:#fff;color:#3a1250;font-size:14px;font-weight:600;line-height:1.25;text-align:center;
  transform:translateX(-50%) scale(.6);opacity:0;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
#bubble.food{background:#fff3b8}
#bubble::after{content:"";position:absolute;left:calc(50% + var(--tx,0px));bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.food::after{border-top-color:#fff3b8}
#bubble.below::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid #fff}
#bubble.below.food::after{border-bottom-color:#fff3b8}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:4;pointer-events:none;font-family:'Pacifico',cursive;font-size:clamp(22px,6vw,34px);color:var(--gold);text-shadow:0 2px 0 #7a2a6a,0 0 20px rgba(255,209,102,.8);opacity:0}
#banner.go{animation:ban 1.8s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(12,5,32,.72);border-radius:15px;backdrop-filter:blur(3px)}
#ov.hide{display:none}
.cardx{max-width:86%;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.cardx .big{font-size:46px;line-height:1}
.cardx h2{margin:0;font-family:'Pacifico',cursive;font-weight:400;font-size:24px}
.cardx p{margin:0;font-size:14px;opacity:.9;line-height:1.35}
#go,#next{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:10px 26px;cursor:pointer;text-decoration:none;color:#3a1250;background:linear-gradient(135deg,var(--gold),var(--pink));box-shadow:0 4px 0 #8a2d73;animation:pu 1.2s ease-in-out infinite alternate}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2d73}
#next{display:none;font-size:15px;padding:8px 20px;background:#fff;box-shadow:0 4px 0 #b9a0d6;animation:none}
#next.on{display:inline-block}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.06)}}
.hint{font-size:12px;opacity:.7;text-align:center}
.dp{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin-top:2px}
.dp button{border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;border-radius:18px;touch-action:manipulation;backdrop-filter:blur(6px)}
.dp button:active{background:var(--pink);transform:scale(.94)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .d{grid-column:2;grid-row:2}.dp .r{grid-column:3;grid-row:2}
@media (pointer:coarse),(max-width:700px){.dp{display:grid}.hint.k{display:none}}
@media (prefers-reduced-motion:reduce){.fl,body::before,#go{animation:none}}
#skip{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:10;font:inherit;font-weight:600;font-size:15px;color:#3a1250;text-decoration:none;background:linear-gradient(135deg,#ffd166,#ff6fb5);border-radius:999px;padding:9px 18px;box-shadow:0 4px 0 #8a2d73,0 0 18px rgba(255,111,181,.5)}
#skip:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2d73}
#skip:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<span class="fl" style="left:4%;top:14%">🌙</span><span class="fl" style="right:5%;top:22%;animation-delay:-2s">✨</span><span class="fl" style="left:6%;bottom:18%;animation-delay:-4s">🎈</span><span class="fl" style="right:6%;bottom:14%;animation-delay:-1s">🎂</span>

<h1>Snake Party 🐍</h1>
<p class="sub">Saanp wala game with a twist 😜</p>

<div class="hud">
  <div class="chip" id="cScore">📸 0</div>
  <div class="chip" id="cLevel">⚡ Lv 1</div>
  <div class="chip" id="cBest">🏆 0</div>
  <button class="ib" id="bPause" aria-label="Pause">⏸</button>
  <button class="ib" id="bMute" aria-label="Sound on or off">🔊</button>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="bubble"></div>
  <div id="banner"></div>
  <div id="ov">
    <div class="cardx" id="card">
      <div class="big">🐍</div>
      <h2>Snake Party</h2>
      <p>Is saanp ka chehra mera hai, aur khana tumhari photo hai 😂 Usse khilate jao, counter badhate jao!</p>
      <button id="go">Start</button>
      <a id="next" href="page8.html">Next page 💌</a>
    </div>
  </div>
</div>

<div class="hint k">Arrow keys or W A S D to move · Space to pause</div>
<div class="dp" aria-label="Direction buttons">
  <button class="u" data-d="0,-1" aria-label="Up">▲</button>
  <button class="l" data-d="-1,0" aria-label="Left">◀</button>
  <button class="d" data-d="0,1" aria-label="Down">▼</button>
  <button class="r" data-d="1,0" aria-label="Right">▶</button>
</div>

<script>
(()=>{
/* ---- Settings: change file names here if needed ---- */
const HER='pht71.jpeg';   // her photo = food
const HIM='pht72.jpeg';   // your photo = snake head
const NEXT='page8.html';
const N=14, STEP0=150;

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),bubble=$('bubble'),ov=$('ov');
let S=360,cell=S/N,dpr=1;
function load(src){const i=new Image();i.ok=false;i.onload=()=>{i.ok=true};i.src=src;return i}
const herImg=load(HER),himImg=load(HIM);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const SAY_EAT=["🔥","Hazam! Agli lao 🍽️","Pet bhar gaya?😎"];
const SAY_FOOD=["Bachao bachao! 😱"];
const SAY_OVER=["Oops! Apni hi poonch kha li 🤦","Aaah! Gol gol ghoom gaya 😵‍💫","Arre! Khud se takra gaya 😂"];
const MILE={5:["5 photos! Shuruaat achhi hai 🎉","Saanp ko maza aa raha hai!"],10:["10 photos! Veryy Nicee😋"],15:["15! Tum toh pro nikle 🏆",],20:["20! Legend 👑","Birthday girl ko salaam 🙇"],30:["30!! Ab rukna mat 🚀","Record banane wala hai!"]};

/* ---- Audio (made with WebAudio, no files needed) ---- */
let ac=null,muted=false;
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,when,dur,type,vol,f2){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+when;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={
 eat(){tone(520,0,.09,'square',.1,900);tone(900,.08,.14,'triangle',.15,1500)},
 start(){[392,523,659,784].forEach((f,i)=>tone(f,i*.08,.15,'triangle',.15))},
 over(){tone(420,0,.5,'sawtooth',.13,90);tone(210,.15,.5,'square',.09,60)},
 win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.16))},
 turn(){tone(320,0,.04,'sine',.04)},
 pop(){tone(750,0,.1,'sine',.12,220)}
};

/* ---- State ---- */
let snake,dir,queue,food,score=0,best=0,tickMs,acc=0,last=0,state='idle',parts=[],floats=[],shake=0,unlocked=false,bubT=0,bubWho='snake';
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}

function resize(){
  const touch=matchMedia('(pointer:coarse),(max-width:700px)').matches;
  S=Math.max(238,Math.min(innerWidth-30,innerHeight-(touch?320:230),540));
  S=Math.floor(S/N)*N;cell=S/N;dpr=window.devicePixelRatio||1;
  cv.width=S*dpr;cv.height=S*dpr;cv.style.width=cv.style.height=S+'px';
}
function reset(){
  snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir={x:1,y:0};queue=[];score=0;tickMs=STEP0;acc=0;parts=[];floats=[];
  placeFood();hud();
}
function placeFood(){
  let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function hud(bump){
  $('cScore').textContent='📸 '+score;$('cLevel').textContent='⚡ Lv '+(1+Math.floor(score/5));$('cBest').textContent='🏆 '+best;
  if(bump){const c=$('cScore');c.classList.add('bump');setTimeout(()=>c.classList.remove('bump'),180)}
}

/* ---- Speech bubble ---- */
function say(text,who,ms){
  bubble.textContent=text;bubble.className='show '+(who||'snake');bubWho=who||'snake';
  clearTimeout(bubT);bubT=setTimeout(()=>bubble.classList.remove('show'),ms||2300);
}
function placeBubble(){
  if(!bubble.classList.contains('show')||!snake)return;
  const p=bubWho==='food'?food:snake[0];
  const cx=(p.x+.5)*cell,cy=p.y*cell,bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  const below=cy<bh+cell;
  const left=Math.min(Math.max(cx,bw/2+4),S-bw/2-4);
  const tx=Math.max(-(bw/2-16),Math.min(bw/2-16,cx-left));
  bubble.style.left=left+'px';
  bubble.style.top=(below?cy+cell*1.28+10:cy-bh-14)+'px';
  bubble.style.setProperty('--tx',tx+'px');
  bubble.classList.toggle('below',below);
}
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}

/* ---- Game logic ---- */
function turn(dx,dy){
  if(state!=='play')return;
  const ref=queue.length?queue[queue.length-1]:dir;
  if((ref.x===-dx&&ref.y===-dy)||(ref.x===dx&&ref.y===dy))return;
  if(queue.length<3){queue.push({x:dx,y:dy});sfx.turn()}
}
function step(){
  if(queue.length)dir=queue.shift();
  const h=snake[0],nx=(h.x+dir.x+N)%N,ny=(h.y+dir.y+N)%N;   // walls wrap around
  const eating=nx===food.x&&ny===food.y;
  const body=eating?snake:snake.slice(0,-1);
  if(body.some(s=>s.x===nx&&s.y===ny)){gameOver();return}
  snake.unshift({x:nx,y:ny});
  if(eating)eat();else snake.pop();
}
function eat(){
  const fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;
  score++;tickMs=Math.max(70,STEP0-score*4);
  burst(fx,fy,score%5===0?26:10);floats.push({x:fx,y:fy,t:0,s:'+1'});
  sfx.eat();hud(true);
  if(score>best){best=score;try{localStorage.setItem('snakeBest',best)}catch(e){}hud()}
  if(score>=10)unlocked=true;
  placeFood();
  if(MILE[score]){
    banner(MILE[score][0]);say(MILE[score][1],'snake',2600);setTimeout(()=>sfx.win(),120);
  }else if(Math.random()<.65){say(pick(SAY_EAT),'snake')}
  else{setTimeout(()=>{if(state==='play'){say(pick(SAY_FOOD),'food',2000);sfx.pop()}},350)}
}
function burst(x,y,n){
  const E=['💖','✨','🎉','⭐','🎈'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1.5+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,l:50+Math.random()*20,e:pick(E)})}
}
function gameOver(){
  state='over';sfx.over();shake=14;unlocked=true;
  say(pick(SAY_OVER),'snake',2400);
  setTimeout(()=>{
    if(state!=='over')return;
    const msg=score>=20?"Legend! Saanp ne party kar li 👑":score>=10?"Mast khela! Saanp khush hai 😋":score>=5?"Achha tha! Ek aur try? 🐍":"Chalo phir se, ab pakka jeetenge 💪";
    showOv(score>=10?'🏆':'😵','Game over',"Photos khayi: "+score+" · Best: "+best+"\n"+msg,'Play again');
  },1100);
}
function showOv(emoji,title,text,btn){
  $('card').querySelector('.big').textContent=emoji;
  $('card').querySelector('h2').textContent=title;
  const p=$('card').querySelector('p');p.textContent=text;p.style.whiteSpace='pre-line';
  $('go').textContent=btn;$('next').classList.toggle('on',unlocked);ov.classList.remove('hide');
  $('go').focus({preventScroll:true});
}
function start(){
  initAudio();reset();state='play';ov.classList.add('hide');bubble.classList.remove('show');
  sfx.start();say("Chalo shuru! Photo kahan hai? 👀",'snake',2000);$('go').blur();
}
function pause(){
  if(state==='play'){state='pause';showOv('⏸','Paused','Saanp thoda aaram kar raha hai 😴','Resume')}
}
function resume(){state='play';ov.classList.add('hide');acc=0;$('go').blur()}

/* ---- Drawing ---- */
function circImg(img,cx,cy,r,emoji){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.clip();
  if(img.ok&&img.naturalWidth){
    const w=img.naturalWidth,h=img.naturalHeight,sw=Math.min(w,h);
    ctx.drawImage(img,(w-sw)/2,(h-sw)/3,sw,sw,cx-r,cy-r,r*2,r*2);
  }else{
    ctx.fillStyle='#ffd1ec';ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.font=(r*1.4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,cx,cy+r*.08);
  }
  ctx.restore();
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  if(!snake)return;
  ctx.save();
  if(shake>.5){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}else shake=0;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.fillStyle=(x+y)%2?'rgba(255,255,255,.04)':'rgba(255,255,255,.085)';ctx.fillRect(x*cell,y*cell,cell,cell)}
  // food = her photo
  const fx=(food.x+.5)*cell,fy=(food.y+.5)*cell+Math.sin(t/250)*cell*.07,fr=cell*.78*(1+.05*Math.sin(t/170));
  ctx.save();ctx.shadowColor='#ffd166';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(fx,fy,fr+2,0,6.2832);ctx.fillStyle='#ffd166';ctx.fill();ctx.restore();
  circImg(herImg,fx,fy,fr,'👧');
  // body
  const L=snake.length;
  for(let i=L-1;i>=1;i--){
    const s=snake[i],cx=(s.x+.5)*cell,cy=(s.y+.5)*cell,r=cell*(.44-.13*i/L),col='hsl('+((335+i*9)%360)+',85%,62%)';
    const q=snake[i-1];
    if(Math.abs(q.x-s.x)<=1&&Math.abs(q.y-s.y)<=1){ctx.strokeStyle=col;ctx.lineWidth=r*2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo((q.x+.5)*cell,(q.y+.5)*cell);ctx.stroke()}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.fill();
  }
  // head = your photo, with a wiggly tongue
  const h=snake[0],hx=(h.x+.5)*cell,hy=(h.y+.5)*cell,hr=cell*.78;
  if(state==='play'){
    const w=Math.sin(t/60)*cell*.08,tx=hx+dir.x*cell*1.25,ty=hy+dir.y*cell*1.25;
    ctx.strokeStyle='#ff3b5c';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx+dir.x*hr,hy+dir.y*hr);ctx.lineTo(tx,ty);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+dir.x*cell*.25+dir.y*cell*.2+w,ty+dir.y*cell*.25+dir.x*cell*.2+w);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+dir.x*cell*.25-dir.y*cell*.2-w,ty+dir.y*cell*.25-dir.x*cell*.2-w);ctx.stroke();
  }
  ctx.save();ctx.shadowColor='#ff6fb5';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(hx,hy,hr+2.5,0,6.2832);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
  circImg(himImg,hx,hy,hr,'😎');
  // particles
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(cell*.6)+'px serif';
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--;if(p.l<=0){parts.splice(i,1);continue}ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillText(p.e,p.x,p.y)}
  ctx.globalAlpha=1;ctx.font='700 '+(cell*.8)+'px Fredoka,sans-serif';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t++;if(f.t>40){floats.splice(i,1);continue}ctx.globalAlpha=1-f.t/40;ctx.fillStyle='#ffd166';ctx.fillText(f.s,f.x,f.y-cell*.9-f.t*.8)}
  ctx.globalAlpha=1;ctx.restore();
}
function frame(t){
  const dt=Math.min(100,t-(last||t));last=t;
  if(state==='play'){acc+=dt;while(acc>=tickMs&&state==='play'){acc-=tickMs;step()}}
  draw(t);placeBubble();requestAnimationFrame(frame);
}

/* ---- Input ---- */
const KEYS={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
addEventListener('keydown',e=>{
  if(KEYS[e.key]){e.preventDefault();turn(...KEYS[e.key]);return}
  if(e.key===' '||e.key==='Enter'||e.key==='p'||e.key==='P'){
    if(e.key===' '||e.key==='Enter')e.preventDefault();
    if(state==='play'&&e.key!=='Enter')pause();
    else if(state==='pause')resume();
    else if((state==='idle'||state==='over')&&e.key!=='p'&&e.key!=='P')start();
  }
});
addEventListener('keyup',e=>{if(e.key===' ')e.preventDefault()});
$('go').addEventListener('click',()=>{if(state==='pause')resume();else start()});
$('bPause').addEventListener('click',()=>{if(state==='play')pause();else if(state==='pause')resume();$('bPause').blur()});
$('bMute').addEventListener('click',()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊';initAudio();$('bMute').blur()});
document.querySelectorAll('.dp button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const[d1,d2]=b.dataset.d.split(',').map(Number);turn(d1,d2)}));
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
stage.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
stage.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('resize',resize);


resize();reset();hud();requestAnimationFrame(frame);
})();
