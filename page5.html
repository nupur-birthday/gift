<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whack-a-Me!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#150f35; --dusk:#2a1d63; --moon:#fff3c9;
  --gold:#ffd36b; --marigold:#ffb938; --pink:#ff6fa5; --rose:#d9457f; --mint:#7ef0c0;
  --grass:#2e8a58; --grass-d:#1f6b46; --dirt:#7a4f33;
  --hw:clamp(92px, 22vw, 150px);   /* hammer size */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color:#fff; overflow:hidden; background:var(--night);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
}
body.playing, body.playing *{cursor:none}
img{-webkit-user-drag:none;user-drag:none}

/* ---------- night scenery ---------- */
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#120c30 0%,#2a1d63 52%,#5a3a8a 78%,#8a4a8f 100%)}
.stars{position:fixed;inset:0 0 40% 0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8}
.stars i.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.moon{position:fixed;right:9%;top:16%;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe6,var(--moon) 60%,#f0dc9a);
  box-shadow:0 0 40px 12px rgba(255,243,201,.35)}
.lanterns{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lantern{position:absolute;bottom:-60px;border-radius:40% 40% 46% 46%;
  background:radial-gradient(circle at 50% 40%,#fff2b0,#ffb938 55%,#ff8a3c);
  box-shadow:0 0 18px 6px rgba(255,185,56,.45);opacity:.85;animation:drift linear infinite}
@keyframes drift{to{transform:translate(var(--sway),-115vh)}}
.hills{position:fixed;left:0;right:0;bottom:0;height:34%;pointer-events:none}
.hills::before,.hills::after{content:"";position:absolute;border-radius:50%}
.hills::before{left:-20%;right:30%;bottom:-60%;height:120%;background:#17543a}
.hills::after{left:35%;right:-25%;bottom:-70%;height:130%;background:#103f2c}

.bunting{position:fixed;top:0;left:0;right:0;max-width:900px;margin:0 auto;display:flex;padding:0 6px;pointer-events:none;z-index:5}
.bunting::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.35)}
.bunting span{flex:1;height:34px;margin:3px 3px 0;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%)}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:52px 12px 16px}
h1{margin:0;font-size:clamp(32px,7vw,54px);line-height:1;font-weight:700;color:var(--gold);
  transform:rotate(-2deg);text-shadow:0 3px 0 var(--rose),0 7px 14px rgba(0,0,0,.4)}
.rule{margin:0;font-size:clamp(15px,3.6vw,19px);color:#fbe9ff;text-align:center}
.rule b{color:var(--mint);font-weight:700}

.hud{display:flex;align-items:center;gap:10px;width:var(--fw)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.18);font-weight:600;font-size:18px;color:#fff;font-family:inherit}
button.pill{cursor:pointer}
.bar{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--mint),var(--gold));transition:transform .1s linear}
.low .bar i{background:var(--pink)}
.low #time{color:var(--pink)}

/* ---------- the field ---------- */
.field{--fw:max(260px,min(92vw,540px,calc(100vh - 290px)));--fw:max(260px,min(92vw,540px,calc(100dvh - 290px)));
  width:var(--fw);aspect-ratio:1/1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3%;padding:4%;
  border-radius:30px;border:5px solid #174f36;touch-action:none;
  background:
    radial-gradient(circle at 18% 8%,rgba(126,240,192,.28),transparent 38%),
    repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 6px,transparent 6px 14px),
    linear-gradient(180deg,var(--grass),var(--grass-d));
  box-shadow:0 22px 44px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.08)}
.hud{--fw:max(260px,min(92vw,540px,calc(100vh - 290px)));--fw:max(260px,min(92vw,540px,calc(100dvh - 290px)))}

.hole{position:relative;min-width:0;min-height:0}
.dark{position:absolute;left:7%;right:7%;bottom:6%;height:28%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#0a0612 40%,#24140e 100%);border:4px solid var(--dirt);
  box-shadow:0 4px 0 #4a2d1d,inset 0 8px 12px rgba(0,0,0,.7)}
.rim{position:absolute;left:7%;right:7%;bottom:6%;height:28%;border-radius:50%;border:4px solid #a56d46;
  clip-path:inset(50% -2px -2px -2px);box-shadow:0 4px 0 #4a2d1d;z-index:3;pointer-events:none}
/* the mole is visible above the hole's middle line and inside the hole's oval, so it rises out of the hole */
.clip{position:absolute;inset:0;z-index:2;
  -webkit-mask-image:linear-gradient(#000,#000),radial-gradient(ellipse 43% 14% at 50% 80%,#000 99%,transparent 100%);
  mask-image:linear-gradient(#000,#000),radial-gradient(ellipse 43% 14% at 50% 80%,#000 99%,transparent 100%);
  -webkit-mask-size:100% 80%,100% 100%;mask-size:100% 80%,100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0,0 0;mask-position:0 0,0 0}
.mole{position:absolute;left:50%;bottom:2%;width:66%;aspect-ratio:1;transform-origin:50% 100%;
  transform:translate(-50%,108%) rotate(var(--tilt,0deg));transition:transform .18s ease-in}
.mole.up{transform:translate(-50%,0) rotate(var(--tilt,0deg));transition:transform .22s cubic-bezier(.2,1.6,.4,1)}
.mole.up.hit{transform:translate(-50%,0) rotate(0deg) scale(1.22,.5);transition:transform .08s ease-out}
.mole img,.mole .fb{width:100%;height:100%;border-radius:50%;border:5px solid var(--gold);
  box-shadow:0 0 0 3px var(--rose),0 6px 12px rgba(0,0,0,.4);background:#ffffff33;display:block;object-fit:cover}
.mole .fb{display:none;place-items:center;font-size:clamp(30px,9vw,58px);background:linear-gradient(135deg,var(--pink),var(--marigold))}
.dizzy{position:absolute;left:50%;top:-12%;transform:translateX(-50%);font-size:clamp(18px,5vw,30px);opacity:0;white-space:nowrap}
.mole.hit .dizzy{opacity:1;animation:dz .5s linear infinite}
@keyframes dz{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}

/* ---------- hammer ---------- */
#hpos{position:fixed;left:0;top:0;width:var(--hw);z-index:80;pointer-events:none;opacity:0;transform-origin:0 0}
#ham{width:100%;transform-origin:50% 0;transform:rotate(-30deg)}
#ham svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
#ham.swing{animation:swing .36s ease-in-out}
@keyframes swing{0%{transform:rotate(-30deg)}20%{transform:rotate(-100deg)}45%{transform:rotate(20deg)}60%{transform:rotate(12deg)}100%{transform:rotate(-30deg)}}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
#fx span{position:absolute;translate:-50% -50%;will-change:transform}
.spark{font-size:22px;animation:spark .6s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.pop{font-weight:700;font-size:clamp(24px,6vw,38px);color:#fff;-webkit-text-stroke:2px var(--rose);paint-order:stroke fill;
  text-shadow:0 3px 0 var(--rose);animation:pop .7s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}25%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:translateY(-48px) scale(1) rotate(-3deg);opacity:0}}
.laugh{font-size:32px;animation:laugh 1.1s ease-out forwards}
@keyframes laugh{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-130px) scale(1.2) rotate(14deg);opacity:0}}
.rain{top:-8vh;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(12,8,38,.7);backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.card{width:min(420px,100%);text-align:center;padding:24px 22px 22px;border-radius:28px;border:3px solid var(--gold);
  background:linear-gradient(180deg,#2e2070,#1b1340);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.card h2{margin:0 0 8px;font-size:clamp(30px,8vw,42px);color:var(--gold);text-shadow:0 3px 0 var(--rose);line-height:1.05}
.card p{margin:8px 0;font-size:18px;line-height:1.35;color:#f3e8ff}
.thumbs{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.thumbs img,.thumbs span{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 2px var(--rose);display:grid;place-items:center;font-size:30px;background:#ffffff22}
.big{font-size:64px;line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.btn{font:inherit;font-weight:700;font-size:20px;padding:12px 26px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
  background:var(--marigold);color:#3a1d00;box-shadow:0 5px 0 #b8741a;display:inline-block}
.btn.alt{background:var(--pink);color:#3a0020;box-shadow:0 5px 0 var(--rose)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8741a}
.btn:focus-visible,.pill:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

@media (prefers-reduced-motion:reduce){.lantern,.stars i.tw{animation:none}}
</style>
</head>
<body>

<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="lanterns" id="lanterns"></div>
<div class="hills"></div>
<div class="bunting" id="bunting"></div>

<main class="wrap" id="stage">
  <h1>Whack-a-Me!</h1>
  <p class="rule">Game time: <b>30 seconds</b>. Tap a face to bonk it!</p>

  <div class="hud" id="hud">
    <div class="pill" aria-label="Time left">⏱ <span id="time">30</span>s</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="pill" id="scorePill" aria-label="Score">🔨 <span id="score">0</span></div>
    <button class="pill" id="mute" aria-label="Sound on or off">🔊</button>
  </div>

  <section class="field" id="field" aria-label="Whack-a-mole field"></section>
</main>

<!-- start screen -->
<div class="overlay" id="start">
  <div class="card">
    <div class="big">😂</div>
    <h2>Whack-a-Me!</h2>
    <p>Your own faces are popping out of the holes. Grab the hammer and bonk them all!</p>
    <div class="thumbs" id="thumbs"></div>
    <p><b>30 seconds</b> on the clock. Every bonk is one point.</p>
    <div class="btns"><button class="btn" id="startBtn">Start bonking 🔨</button></div>
  </div>
</div>

<!-- end screen -->
<div class="overlay hidden" id="end">
  <div class="card">
    <div class="big">🤣</div>
    <h2>Time's up!</h2>
    <p>You bonked <b id="finalScore">0</b> faces</p>
    <p id="endMsg"></p>
    <p style="font-size:15px;opacity:.8">Best today: <span id="best">0</span></p>
    <div class="btns">
      <button class="btn" id="again">Play again 🔁</button>
      <a class="btn alt" id="next" href="page6.html">Continue 💌</a>
    </div>
  </div>
</div>

<!-- hammer -->
<div id="hpos"><div id="ham">
  <svg viewBox="0 0 100 175" aria-hidden="true">
    <rect x="44" y="0" width="12" height="125" rx="6" fill="#c98a4b" stroke="#7a4a22" stroke-width="3"/>
    <rect x="42" y="0" width="16" height="36" rx="7" fill="#ff6fa5" stroke="#d9457f" stroke-width="3"/>
    <rect x="6" y="108" width="88" height="58" rx="16" fill="#ffb938" stroke="#a86a00" stroke-width="4"/>
    <rect x="6" y="108" width="16" height="58" rx="10" fill="#ff6fa5" stroke="#d9457f" stroke-width="3"/>
    <rect x="78" y="108" width="16" height="58" rx="10" fill="#ff6fa5" stroke="#d9457f" stroke-width="3"/>
    <path d="M50 152c-10-8-16-14-16-20a8 8 0 0 1 16-3a8 8 0 0 1 16 3c0 6-6 12-16 20z" fill="#fff"/>
  </svg>
</div></div>
<div id="fx"></div>

<script>
/* ================== EDIT THESE ================== */
const IMAGES    = ['pht61.jpeg', 'pht62.jpeg', 'pht63.jpeg'];  // her 3 photos, same folder as this file
const NEXT_PAGE = 'page6.html';                              // where "Continue" goes
const GAME_TIME = 30;                                        // seconds
const WORDS = ['BONK!', 'BOINK!', 'OOF!', 'SPLAT!', 'HEHE!', 'OUCHIE!', 'YEET!', 'POOF!'];
function endMessage(n){
  if(n < 6)  return 'Slow hands! Buddhi ho rahi ho kya? 😜';
  if(n < 15) return 'Not bad at all! Those hands know how to swing 😆';
  return 'Wow, you bonked yourself that many times?! Champion 🤣🏆';
}
/* ================================================ */

const LAUGH = ['😂','🤣','😆','😹','🤭','😜'];
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (a,b) => a + Math.random()*(b-a);

/* ---------- scenery ---------- */
(function scenery(){
  const st=$('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('i');
    s.style.left=rnd(0,100)+'%'; s.style.top=rnd(0,100)+'%';
    const z=rnd(1.5,3.5); s.style.width=s.style.height=z+'px';
    if(i%7===0){ s.className='tw'; s.style.animationDelay=rnd(0,3)+'s'; }
    st.appendChild(s);
  }
  const cols=['#ff6fa5','#ffb938','#7ef0c0','#8fb8ff','#c59bff'];
  const b=$('bunting');
  for(let i=0;i<14;i++){ const f=document.createElement('span'); f.style.setProperty('--c',cols[i%cols.length]); b.appendChild(f); }
  const L=$('lanterns');
  for(let i=0;i<7;i++){
    const l=document.createElement('div'); l.className='lantern';
    const w=rnd(14,24); l.style.width=w+'px'; l.style.height=w*1.25+'px';
    l.style.left=rnd(3,95)+'%'; l.style.animationDuration=rnd(22,38)+'s'; l.style.animationDelay=(-rnd(0,30))+'s';
    l.style.setProperty('--sway',rnd(-60,60)+'px');
    L.appendChild(l);
  }
})();

/* ---------- images ---------- */
const imgOk = {};
IMAGES.forEach(src=>{ const im=new Image(); im.onload=()=>imgOk[src]=true; im.onerror=()=>imgOk[src]=false; im.src=src; });
(function thumbs(){
  $('thumbs').innerHTML='';
  IMAGES.forEach(src=>{
    const im=document.createElement('img'); im.src=src; im.alt='';
    im.onerror=()=>{ const s=document.createElement('span'); s.textContent=pick(LAUGH); im.replaceWith(s); };
    $('thumbs').appendChild(im);
  });
})();
$('next').href = NEXT_PAGE;

/* ---------- holes ---------- */
const field=$('field'), holes=[];
for(let i=0;i<9;i++){
  const el=document.createElement('div'); el.className='hole'; el.dataset.i=i;
  el.innerHTML='<div class="dark"></div><div class="clip"><div class="mole"><img alt="" draggable="false"><div class="fb"></div><div class="dizzy">💫</div></div></div><div class="rim"></div>';
  field.appendChild(el);
  holes.push({el, mole:el.querySelector('.mole'), img:el.querySelector('img'), fb:el.querySelector('.fb'), up:false, hit:false, timer:null});
}
function setFace(h,src){
  if(imgOk[src]===false){ h.img.style.display='none'; h.fb.style.display='grid'; h.fb.textContent=pick(LAUGH); }
  else { h.fb.style.display='none'; h.img.style.display='block'; h.img.src=src; }
}

/* ---------- sound (made in the browser, no files needed) ---------- */
let ctx=null, muted=false;
function ac(){
  if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function tone(o){
  if(muted) return; const c=ac(); if(!c) return;
  const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f0,t);
  if(o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);
  if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); f.connect(g); } else osc.connect(g);
  if(o.wob){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.wob.rate; lg.gain.value=o.wob.depth; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+o.dur+.05); }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol||.3,t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  g.connect(c.destination); osc.start(t); osc.stop(t+o.dur+.05);
}
function noise(o){
  if(muted) return; const c=ac(); if(!c) return;
  const len=Math.floor(c.sampleRate*o.dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=o.freq||1500;
  const g=c.createGain(); g.gain.value=o.vol||.3;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(c.currentTime);
}
const sfx={
  pop(){   tone({f0:260,f1:520,dur:.08,vol:.1}); },
  swing(){ noise({dur:.14,vol:.12,freq:700}); },
  bonk(){  tone({f0:380,f1:60,dur:.2,vol:.6}); noise({dur:.06,vol:.35,freq:2200}); },
  boing(){ tone({f0:180,f1:620,dur:.45,vol:.3,wob:{rate:22,depth:90}}); },
  squeak(){tone({type:'triangle',f0:1100,f1:2300,dur:.1,vol:.22}); tone({type:'triangle',f0:2300,f1:1500,dur:.12,vol:.2,at:.1}); },
  honk(){  tone({type:'sawtooth',f0:330,f1:290,dur:.22,vol:.2,lp:1400}); tone({type:'sawtooth',f0:337,f1:295,dur:.22,vol:.15,lp:1400}); },
  wah(){   [[311,.16,0],[293,.16,.18],[277,.18,.36],[233,.32,.56]].forEach(n=>tone({type:'sawtooth',f0:n[0],f1:n[0]*.94,dur:n[1],vol:.2,lp:900,at:n[2]})); },
  laugh(){ for(let k=0;k<4;k++) tone({type:'triangle',f0:620-k*35,f1:520-k*35,dur:.09,vol:.25,at:k*.12}); },
  fanfare(){[523,659,784,1047,784,1047].forEach((f,k)=>tone({type:'triangle',f0:f,f1:f,dur:.2,vol:.25,at:k*.13})); }
};
function hitSound(){ sfx.bonk(); pick([sfx.boing,sfx.squeak,sfx.honk,sfx.wah,sfx.laugh])(); }
$('mute').addEventListener('click',()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; });

/* ---------- effects ---------- */
const fx=$('fx');
function spawnFx(cls,text,x,y,vars){
  const s=document.createElement('span'); s.className=cls; s.textContent=text;
  s.style.left=x+'px'; s.style.top=y+'px';
  if(vars) for(const k in vars) s.style.setProperty(k,vars[k]);
  fx.appendChild(s); s.addEventListener('animationend',()=>s.remove());
}
function hitEffects(h,x,y){
  h.mole.classList.add('hit');
  hitSound();
  spawnFx('pop',pick(WORDS),x,y-30);
  for(let i=0;i<7;i++){ const a=Math.random()*Math.PI*2, d=rnd(40,95);
    spawnFx('spark',pick(['⭐','✨','💥']),x,y,{'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px'}); }
  for(let i=0;i<2;i++) spawnFx('laugh',pick(LAUGH),x+rnd(-26,26),y-10,{'--dx':rnd(-45,45)+'px'});
  field.animate([{transform:'translate(0,0)'},{transform:'translate(-3px,2px)'},{transform:'translate(3px,-2px)'},{transform:'translate(0,0)'}],{duration:140});
  $('scorePill').animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:180});
  h.timer=setTimeout(()=>retreat(holes.indexOf(h)),430);
}

/* ---------- hammer ---------- */
const hpos=$('hpos'), ham=$('ham');
function placeHammer(x,y){
  const w=hpos.offsetWidth, L=w*1.37, a=20*Math.PI/180;       /* head centre lands on the pointer when the swing hits */
  hpos.style.transform=`translate(${x+L*Math.sin(a)-w/2}px,${y-L*Math.cos(a)}px)`;
}
function swing(){ ham.classList.remove('swing'); void ham.offsetWidth; ham.classList.add('swing'); }
let lastPointer='mouse';
ham.addEventListener('animationend',()=>{ ham.classList.remove('swing'); if(lastPointer!=='mouse') hpos.style.opacity=0; });

/* ---------- game ---------- */
let running=false, score=0, t0=0, tickT=null, spawnT=null, lastSrc='', lastHole=-1;
const best = (()=>{ try{ return +localStorage.getItem('whackBest')||0; }catch(e){ return 0; } })();
let bestScore = best;

function popUp(i){
  const h=holes[i]; h.up=true; h.hit=false;
  let src; do{ src=pick(IMAGES); }while(src===lastSrc && IMAGES.length>1); lastSrc=src;
  setFace(h,src);
  h.mole.style.setProperty('--tilt',rnd(-8,8)+'deg');
  h.mole.classList.remove('hit'); h.mole.classList.add('up');
  sfx.pop();
  const el=(performance.now()-t0)/1000;
  h.timer=setTimeout(()=>retreat(i), Math.max(620,1150-el*17)+rnd(0,250));
}
function retreat(i){ const h=holes[i]; clearTimeout(h.timer); h.up=false; h.mole.classList.remove('up'); }

function spawnLoop(){
  if(!running) return;
  const el=(performance.now()-t0)/1000, maxUp = el>20?3 : el>10?2 : 1;
  if(holes.filter(h=>h.up).length < maxUp){
    const free=holes.map((h,i)=>i).filter(i=>!holes[i].up && i!==lastHole);
    lastHole=pick(free); popUp(lastHole);
  }
  spawnT=setTimeout(spawnLoop,rnd(260,580));
}

function startGame(){
  ac();
  score=0; $('score').textContent=0; running=true; t0=performance.now();
  holes.forEach((h,i)=>{ clearTimeout(h.timer); h.up=false; h.mole.classList.remove('up','hit'); });
  $('start').classList.add('hidden'); $('end').classList.add('hidden');
  document.body.classList.add('playing'); $('hud').classList.remove('low');
  sfx.fanfare();
  clearInterval(tickT);
  tickT=setInterval(()=>{
    const left=Math.max(0,GAME_TIME-(performance.now()-t0)/1000);
    $('time').textContent=Math.ceil(left);
    $('barfill').style.transform=`scaleX(${left/GAME_TIME})`;
    if(left<=5) $('hud').classList.add('low');
    if(left<=0) endGame();
  },100);
  spawnT=setTimeout(spawnLoop,600);
}

function endGame(){
  running=false; clearInterval(tickT); clearTimeout(spawnT);
  document.body.classList.remove('playing'); hpos.style.opacity=0;
  holes.forEach((h,i)=>retreat(i));
  if(score>bestScore){ bestScore=score; try{ localStorage.setItem('whackBest',score); }catch(e){} }
  $('finalScore').textContent=score; $('best').textContent=bestScore; $('endMsg').textContent=endMessage(score);
  $('end').classList.remove('hidden');
  sfx.fanfare(); setTimeout(sfx.laugh,700);
  for(let i=0;i<30;i++){
    const s=document.createElement('span'); s.className='rain'; s.textContent=pick(LAUGH);
    s.style.left=rnd(0,100)+'vw'; s.style.animationDuration=rnd(2.2,4)+'s'; s.style.animationDelay=rnd(0,1.6)+'s';
    fx.appendChild(s); s.addEventListener('animationend',()=>s.remove());
  }
}

/* ---------- input (mouse + touch) ---------- */
document.addEventListener('pointermove',e=>{
  if(running && e.pointerType==='mouse'){ lastPointer='mouse'; placeHammer(e.clientX,e.clientY); hpos.style.opacity=1; }
});
document.documentElement.addEventListener('mouseleave',()=>{ if(lastPointer==='mouse') hpos.style.opacity=0; });
document.addEventListener('pointerdown',e=>{
  if(!running || e.target.closest('button,a')) return;
  lastPointer=e.pointerType;
  const x=e.clientX, y=e.clientY;
  placeHammer(x,y); hpos.style.opacity=1; swing(); sfx.swing();
  const holeEl=e.target.closest('.hole'), h=holeEl?holes[+holeEl.dataset.i]:null;
  if(h && h.up && !h.hit){
    h.hit=true; clearTimeout(h.timer);
    score++; $('score').textContent=score;
    setTimeout(()=>hitEffects(h,x,y),150);      /* lands when the hammer does */
  }
});

$('startBtn').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
</script>
</body>
</html>
